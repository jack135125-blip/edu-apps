<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>기하 수업 보조자료</title>
  <style>
    :root {
      --ink: #1a2332; --muted: #5a6577; --line: #d8dee8; --bg: #f6f4ef;
      --card: #fff; --accent: #1e4d7b; --accent-soft: #e8f0f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 400px at 0% -10%, #e4eef6 0%, transparent 55%),
        radial-gradient(800px 360px at 100% 0%, #efe6da 0%, transparent 50%),
        var(--bg);
      line-height: 1.65;
      min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.2rem 3rem; }
    header { margin-bottom: 1.4rem; padding-bottom: 0.9rem; border-bottom: 2px solid var(--accent); }
    .eyebrow { margin: 0 0 0.25rem; color: var(--accent); font-size: 0.82rem; font-weight: 700; }
    h1 { margin: 0 0 0.35rem; font-size: 1.7rem; font-weight: 800; }
    .meta { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .grid { display: grid; gap: 0.85rem; margin-top: 1.2rem; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 1.05rem 1.15rem; box-shadow: 0 8px 22px rgba(26, 35, 50, 0.04);
      transition: border-color 0.15s, transform 0.15s;
    }
    a.card:hover { border-color: #a8c4de; transform: translateY(-2px); }
    .tag {
      display: inline-block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em;
      color: var(--accent); background: var(--accent-soft); border-radius: 999px;
      padding: 0.18rem 0.55rem; margin-bottom: 0.45rem;
    }
    .card h2 { margin: 0 0 0.3rem; font-size: 1.12rem; font-weight: 800; color: var(--accent); }
    .card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    footer { margin-top: 2rem; text-align: center; color: var(--muted); font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">고등학교 기하 · 공간도형</p>
      <h1>기하 수업 보조자료</h1>
      <p class="meta">인터랙티브 도형으로 정리·증명을 따라가 보세요.</p>
    </header>

    <div class="grid">
      <a class="card" href="./삼수선정리_인터랙티브.html">
        <span class="tag">공간도형</span>
        <h2>삼수선 정리</h2>
        <p>세 가지 경우를 전환하며, 직선과 평면의 수직으로 증명을 따라갑니다.</p>
      </a>
      <a class="card" href="./이면각_인터랙티브.html">
        <span class="tag">공간도형</span>
        <h2>이면각</h2>
        <p>용어 · 예제 3 · 문제 3 · 문제 4를 도형을 돌리며 학습합니다.</p>
      </a>
      <a class="card" href="./공간좌표_탐구실.html">
        <span class="tag">공간좌표</span>
        <h2>공간좌표 탐구실</h2>
        <p>좌표를 바꾸고 도형을 회전하며, 두 점 사이의 거리와 수선의 발, 대칭이동을 탐구합니다.</p>
      </a>
      <a class="card" href="./타원.html">
        <span class="tag">이차곡선</span>
        <h2>타원</h2>
        <p>타원 관련 보조자료</p>
      </a>
      <a class="card" href="./쌍곡선.html">
        <span class="tag">이차곡선</span>
        <h2>쌍곡선</h2>
        <p>쌍곡선 관련 보조자료</p>
      </a>
    </div>

    <footer>edu-apps · 기하</footer>
  </div>
</body>
</html>
