px;min-height:36px}.legend{display:flex;gap:16px;padding:12px 23px;border-top:1px solid #e7ece6;flex-wrap:wrap;font-size:13px}.legend span:before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}.result{margin:0;padding:16px 24px;background:#eaf3ec;line-height:1.7;min-height:86px}.result strong{color:#0c6046;font-size:21px}.controls{padding:22px;height:fit-content}.controls h3{font-size:16px;margin:0 0 15px}.coordinate{display:grid;grid-template-columns:22px 1fr 65px;align-items:center;gap:10px;margin:15px 0}.coordinate b{font-size:20px}input[type=range]{width:100%;accent-color:var(--green);height:26px}input[type=number]{width:100%;padding:7px;border:1px solid #b8cbbf;border-radius:7px;text-align:center;min-height:40px}select{width:100%;padding:10px;border:1px solid #b8cbbf;border-radius:8px;background:white;margin:6px 0 12px;min-height:44px}.group{padding-top:18px;margin-top:18px;border-top:1px solid #e1e7df}.btn-row{display:flex;gap:7px;flex-wrap:wrap}.btn-row button{flex:1;font-size:13px}.checkline{display:flex;gap:8px;align-items:center;font-size:13px;margin:13px 0}.note{font-size:13px;line-height:1.7;color:#64796c;margin:12px 0 0}.mission{background:#f8f3e5;padding:15px;border-radius:10px;margin-top:19px}.mission h3{margin:0 0 8px;font-size:15px}.mission p{font-size:13px;line-height:1.7;margin:5px 0 10px}.answers{display:flex;gap:5px;margin-bottom:9px}.feedback{font-size:14px;line-height:1.6;margin-top:10px;min-height:24px}.footer{max-width:1440px;margin:0 auto;padding:0 30px 24px;font-size:12px;color:#6d8074}.hidden{display:none!important}.sr{position:absolute;left:-9999px}details{margin-top:15px;font-size:13px}summary{cursor:pointer;color:#42614f}details p{line-height:1.8}#score{font-size:12px;color:#58705e}.tour{background:#fff6e1;border:1px solid #eedba6;padding:12px 15px;border-radius:9px;margin-top:12px;font-size:13px;line-height:1.7}

</style></head><body>
<header><div><small>GEOMETRY · EXPLORE & DISCOVER</small><h1>공간좌표 탐구실</h1><p>좌표를 바꾸고, 공간을 돌려 보고, 규칙을 발견하세요.</p></div><span class="pill">창원여고 기하 · 교과서 81쪽</span></header>
<nav aria-label="탐구 주제"><button class="active" data-mode="point"><b>슬라이드 7</b>점의 공간좌표</button><button data-mode="foot"><b>슬라이드 9</b>수선의 발</button><button data-mode="plane"><b>슬라이드 10</b>평면에 대한 대칭</button><button data-mode="axis"><b>슬라이드 11</b>축과 원점에 대한 대칭</button></nav>
<main><section class="stage"><div class="stage-head"><h2 id="title"></h2><p id="intro"></p></div><div class="graphic"><svg id="scene" viewBox="0 0 900 640" role="img" aria-label="회전 가능한 3차원 좌표공간" tabindex="0"><title>공간좌표 탐구 그림</title></svg></div><div class="view-tools"><button data-view="space">입체로 보기</button><button data-view="xy">xy평면 정면</button><button data-view="yz">yz평면 정면</button><button data-view="zx">zx평면 정면</button><button id="zoomout" aria-label="그림 축소">−</button><button id="zoomin" aria-label="그림 확대">＋</button><button id="resetview">시점 초기화</button></div><div class="legend"><span style="--c:#bc4b36">원래 점 P</span><span style="--c:#225ea7" id="qlegend">대응점 Q</span><span style="--c:#d69b26" id="targetlegend">선택한 평면 또는 축</span></div><div class="result" id="result" aria-live="polite"></div></section>
<aside class="controls"><div class="coordinate-panel"><h3>점 P의 좌표</h3><div id="inputs"></div><div class="btn-row"><button id="random">좌표 무작위</button><button id="reset">처음 좌표</button></div><p class="note">눈금 한 칸은 1입니다. 그림을 드래그하면 회전하고, 방향키로도 시점을 바꿀 수 있습니다.</p><label class="checkline"><input id="showplanes" type="checkbox" checked>좌표평면 표시</label><label class="checkline"><input id="showbox" type="checkbox" checked>좌표를 읽는 보조선 표시</label></div>
<div class="group" id="targetgroup"><label for="target"><b id="targetlabel">기준 선택</b></label><select id="target"></select><button id="animate" class="primary" style="width:100%">대응점 확인</button><p class="note" id="rule"></p></div>
<div class="group"><h3>직접 확인하기</h3><div class="tour" id="task"></div><details><summary>탐구 도움말</summary><p id="hint"></p></details></div>
<div class="mission"><h3>좌표를 예측해 볼까요?</h3><p id="question"></p><div class="answers"><label class="sr" for="ans0">예측한 x좌표</label><input type="number" id="ans0" step="0.5" placeholder="x"><label class="sr" for="ans1">예측한 y좌표</label><input type="number" id="ans1" step="0.5" placeholder="y"><label class="sr" for="ans2">예측한 z좌표</label><input type="number" id="ans2" step="0.5" placeholder="z"></div><div class="btn-row"><button id="quiz" class="primary">새 문제</button><button id="check">정답 확인</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div id="score"></div></div></aside></main>
<footer class="footer">교과서와 수업 PPT의 개념을 탐구하는 보조자료입니다. 그림은 공간을 평면에 투영한 것으로, 화면에서 보이는 각도와 실제 공간의 각도는 다를 수 있습니다.</footer>
<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const state={mode:'point',p:[3,2,4],target:'xy',yaw:.66,pitch:.48,zoom:1,quiz:false,revealed:true,progress:1,correct:0,total:0,checked:false};
const labels={xy:'xy평면',yz:'yz평면',zx:'zx평면',x:'x축',y:'y축',z:'z축',o:'원점'};
const config={point:{title:'세 수가 정하는 공간의 한 점',intro:'x, y, z를 하나씩 바꿔 보세요. 나머지 두 좌표가 같으면 점은 어느 방향으로 움직일까요?',task:'① x좌표만 바꿔 보세요.<br>② z좌표를 0으로 만들어 보세요.<br>③ 세 좌표를 모두 0으로 만들어 보세요.',hint:'좌표 하나를 바꾸면 그 좌표축과 평행한 방향으로 움직입니다. z=0인 점은 xy평면 위에 있습니다. 원점의 좌표는 (0, 0, 0)입니다.'},foot:{title:'수선을 내리면 어떤 좌표가 0이 될까?',intro:'기준을 바꾸어 수선의 발 H를 비교하세요. 원래 점과 수선의 발을 잇는 선분은 기준과 수직입니다.',task:'① xy평면에 내린 수선의 발을 보세요.<br>② x축에 내린 수선의 발과 비교하세요.<br>③ 원래 점이 기준 위에 있으면 어떻게 될까요?',hint:'평면에 내리면 수직 방향의 좌표 하나가 0이 됩니다. 축에 내리면 그 축의 좌표만 남고 나머지 두 좌표가 0이 됩니다. 점이 이미 기준 위에 있으면 수선의 발은 원래 점과 같습니다.'},plane:{title:'평면을 사이에 두고 마주 보는 두 점',intro:'선택한 평면을 거울이라고 생각해 보세요. 점 P와 대칭점 Q는 평면에서 같은 거리만큼 떨어져 있습니다.',task:'① xy평면과 yz평면을 차례로 선택하세요.<br>② 부호가 바뀌는 좌표를 찾으세요.<br>③ 그 좌표가 0이면 두 점은 어떻게 될까요?',hint:'평면에 수직인 방향의 좌표 하나만 부호가 바뀝니다. 대응하는 두 점의 중점은 선택한 평면 위에 있습니다. 그 평면 위의 점은 대칭이동해도 그대로입니다.'},axis:{title:'축 또는 원점을 기준으로 대칭이동',intro:'평면 대칭과 비교해 보세요. 축 대칭은 그 축을 중심으로 반 바퀴 돌린 위치이고, 원점 대칭은 세 좌표의 부호가 모두 바뀝니다.',task:'① x축에 대한 대칭에서 남는 좌표를 찾으세요.<br>② y축과 z축에 대해서도 확인하세요.<br>③ 원점 대칭과 비교해 보세요.',hint:'축에 대한 대칭에서는 그 축의 좌표는 그대로이고 나머지 두 좌표의 부호가 바뀝니다. 원점 대칭에서는 세 좌표의 부호가 모두 바뀝니다.'}};
function transform(p,mode,target){const q=p.slice();if(mode==='point')return q;const indexes={xy:[2],yz:[0],zx:[1],x:[1,2],y:[0,2],z:[0,1],o:[0,1,2]};for(const i of indexes[target])q[i]=mode==='foot'?0:-q[i];return q.map(v=>Object.is(v,-0)?0:v)}
function fmt(v){return (Object.is(v,-0)?0:v).toString().replace('-','−')}function coord(p){return '('+p.map(fmt).join(', ')+')'}
function el(tag,attrs,text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function project(p){const [x,y,z]=p,a=state.yaw,b=state.pitch,u=-Math.cos(a)*x+Math.sin(a)*y,d=Math.sin(a)*x+Math.cos(a)*y;return [450+u*37*state.zoom,345+(Math.sin(b)*d-Math.cos(b)*z)*37*state.zoom,d*Math.cos(b)+z*Math.sin(b)]}
function path(points){return points.map((p,i)=>(i?'L':'M')+project(p).slice(0,2).join(',')).join(' ')}
function draw(){const svg=$('scene');svg.replaceChildren(el('title',{},'공간좌표 탐구 그림'));const defs=el('defs');for(const [id,color] of [['red','#bd4e3c'],['blue','#2c6baa'],['green','#258061']]){const m=el('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'});m.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color}));defs.append(m)}svg.append(defs);
const planeCoords={xy:[[-5,-5,0],[5,-5,0],[5,5,0],[-5,5,0]],yz:[[0,-5,-5],[0,5,-5],[0,5,5],[0,-5,5]],zx:[[-5,0,-5],[5,0,-5],[5,0,5],[-5,0,5]]};
if($('showplanes').checked){for(const [name,pts] of Object.entries(planeCoords)){const selected=state.mode!=='point'&&state.target===name;svg.append(el('path',{d:path(pts)+'Z',fill:selected?'#eac068':'#89b59d','fill-opacity':selected?.22:.065,stroke:selected?'#ce9926':'#93ae9e','stroke-opacity':.45,'stroke-width':1}));}}
const axes=[{i:0,c:'#bd4e3c',id:'red',name:'x'},{i:1,c:'#2c6baa',id:'blue',name:'y'},{i:2,c:'#258061',id:'green',name:'z'}];
for(const a of axes){const p=[0,0,0],q=[0,0,0];p[a.i]=-5.7;q[a.i]=5.9;const selected=state.mode!=='point'&&state.target===a.name;if(selected)svg.append(el('path',{d:path([p,q]),stroke:'#e1b64d','stroke-width':9,opacity:.35}));svg.append(el('path',{d:path([p,q]),stroke:a.c,'stroke-width':2,'marker-end':`url(#${a.id})`}));const xy=project(q);svg.append(el('text',{x:xy[0]+6,y:xy[1]-6,fill:a.c,'font-size':23,'font-weight':700},a.name));for(let n=-5;n<=5;n++){if(!n)continue;const v=[0,0,0];v[a.i]=n;const t=project(v);svg.append(el('circle',{cx:t[0],cy:t[1],r:1.8,fill:a.c}));if(n%2===0)svg.append(el('text',{x:t[0]+5,y:t[1]+15,fill:a.c,'font-size':12},fmt(n)));}}
const p=state.p,q=transform(p,state.mode,state.target);if($('showbox').checked){const verts=[[0,0,0],[p[0],0,0],[0,p[1],0],[0,0,p[2]],[p[0],p[1],0],[p[0],0,p[2]],[0,p[1],p[2]],p];for(const [i,j] of [[0,1],[0,2],[0,3],[1,4],[1,5],[2,4],[2,6],[3,5],[3,6],[4,7],[5,7],[6,7]])svg.append(el('path',{d:path([verts[i],verts[j]]),fill:'none',stroke:'#7d9384','stroke-dasharray':'4 5','stroke-width':1.1,opacity:.55}));}
let qshow=state.mode!=='point'&&(!state.quiz||state.revealed);const qp=q.map((v,i)=>p[i]+(v-p[i])*state.progress);
if(qshow){svg.append(el('path',{d:path([p,q]),fill:'none',stroke:'#225ea7','stroke-width':2,'stroke-dasharray':state.mode==='foot'?'':'6 5'}));if(state.mode==='plane'||state.mode==='axis'){const mid=p.map((v,i)=>(v+q[i])/2),m=project(mid);svg.append(el('circle',{cx:m[0],cy:m[1],r:3.5,fill:'#d09927'}));}}
const o=project([0,0,0]);svg.append(el('text',{x:o[0]-20,y:o[1]+21,fill:'#4c6355','font-size':16},'O'));
const points=[{p,label:'P'+coord(p),color:'#ba4c35'}];if(qshow)points.push({p:qp,label:(state.mode==='foot'?'H':'Q')+coord(q),color:'#225ea7'});points.sort((a,b)=>project(a.p)[2]-project(b.p)[2]);points.forEach((a,i)=>{const xy=project(a.p);svg.append(el('circle',{cx:xy[0],cy:xy[1],r:7,fill:a.color,stroke:'white','stroke-width':2}));const same=qshow&&p.every((v,j)=>v===q[j]);let label=a.label;if(same&&a.color==='#225ea7')label=(state.mode==='foot'?'P = H':'P = Q')+coord(q);if(same&&a.color==='#ba4c35')return;const x=Math.max(12,Math.min(710,xy[0]+12)),y=Math.max(24,Math.min(615,xy[1]+(i===0?-13:26)));svg.append(el('text',{x,y,fill:a.color,'font-size':19,'font-weight':700},label));});
svg.setAttribute('aria-label',(`점 P${coord(p)}${qshow?'와 '+(state.mode==='foot'?'수선의 발 H':'대칭점 Q')+coord(q):''}. 드래그 또는 방향키로 회전할 수 있습니다.`));}
function update(){for(let i=0;i<3;i++){$('range'+i).value=state.p[i];$('num'+i).value=state.p[i]}const q=transform(state.p,state.mode,state.target),name=labels[state.target];$('qlegend').textContent=state.mode==='foot'?'수선의 발 H':'대칭점 Q';$('qlegend').classList.toggle('hidden',state.mode==='point');$('targetlegend').classList.toggle('hidden',state.mode==='point');
if(state.mode==='point'){$('result').innerHTML=`<strong>P ${coord(state.p)}</strong><br>x좌표 ${fmt(state.p[0])}, y좌표 ${fmt(state.p[1])}, z좌표 ${fmt(state.p[2])}`;$('rule').textContent='';}
else if(state.quiz&&!state.revealed){$('result').textContent=`P${coord(state.p)}의 ${name}${state.mode==='foot'?'에 내린 수선의 발':'에 대한 대칭점'}을 먼저 예측해 보세요.`;$('rule').textContent='정답 확인 전에는 대응점을 숨깁니다.';}
else{const role=state.mode==='foot'?'수선의 발 H':'대칭점 Q';$('result').innerHTML=`<strong>${role} ${coord(q)}</strong><br>${state.p.map((v,i)=>`${'xyz'[i]}: ${fmt(v)} → ${fmt(q[i])}`).join('　')}`;if(state.mode==='foot')$('rule').textContent=state.target.length===2?'평면에 수직인 방향의 좌표 하나가 0이 됩니다.':'그 축의 좌표는 그대로, 나머지 두 좌표는 0이 됩니다.';else if(state.mode==='plane')$('rule').textContent='평면에 수직인 방향의 좌표 하나만 부호가 바뀝니다.';else $('rule').textContent=state.target==='o'?'세 좌표의 부호가 모두 바뀝니다.':'그 축의 좌표는 그대로, 나머지 두 좌표의 부호가 바뀝니다.';if(state.p.every((v,i)=>v===q[i]))$('rule').textContent+=' 원래 점과 대응점이 일치합니다.';}
draw();}
function stopQuiz(){state.quiz=false;state.revealed=true;state.checked=false;state.progress=1;$('feedback').textContent='';$('question').textContent='새 문제를 누르면 좌표와 기준이 정해집니다. 바뀐 점의 좌표를 먼저 예측하세요.';for(let i=0;i<3;i++)$('ans'+i).value='';}
function setMode(mode){state.mode=mode;stopQuiz();document.querySelectorAll('nav button').forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});const c=config[mode];$('title').textContent=c.title;$('intro').textContent=c.intro;$('task').innerHTML=c.task;$('hint').textContent=c.hint;$('targetgroup').classList.toggle('hidden',mode==='point');const options=mode==='foot'?['xy','yz','zx','x','y','z']:mode==='plane'?['xy','yz','zx']:['x','y','z','o'];$('target').replaceChildren(...options.map(v=>{const o=document.createElement('option');o.value=v;o.textContent=labels[v];return o}));state.target=options[0];$('targetlabel').textContent=mode==='foot'?'수선을 내릴 대상':'대칭의 기준';$('animate').textContent=mode==='foot'?'수선의 발 확인':'대칭이동 실행';update();}
for(let i=0;i<3;i++){const row=document.createElement('div');row.className='coordinate';row.innerHTML=`<b style="color:${['#bd4e3c','#2c6baa','#258061'][i]}">${'xyz'[i]}</b><input id="range${i}" type="range" min="-5" max="5" step="0.5" aria-label="${'xyz'[i]}좌표 조절"><input id="num${i}" type="number" min="-5" max="5" step="0.5" aria-label="${'xyz'[i]}좌표 입력">`;$('inputs').append(row);for(const prefix of ['range','num'])$(prefix+i).addEventListener('input',e=>{const n=Number(e.target.value);if(!Number.isFinite(n)||e.target.value===''){return}state.p[i]=Math.round(Math.max(-5,Math.min(5,n))*2)/2;stopQuiz();update()});}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('target').onchange=()=>{state.target=$('target').value;stopQuiz();update()};$('showplanes').onchange=draw;$('showbox').onchange=draw;
function randomPoint(){return Array.from({length:3},()=>Math.floor(Math.random()*9)-4)}$('random').onclick=()=>{state.p=randomPoint();stopQuiz();update()};$('reset').onclick=()=>{state.p=[3,2,4];stopQuiz();update()};
let animation=0;$('animate').onclick=()=>{if(state.quiz&&!state.revealed){$('feedback').textContent='먼저 좌표를 입력하고 정답 확인을 눌러 주세요.';return}cancelAnimationFrame(animation);state.revealed=true;state.progress=0;update();const start=performance.now();function step(now){state.progress=Math.min(1,(now-start)/650);draw();if(state.progress<1)animation=requestAnimationFrame(step)}animation=requestAnimationFrame(step)};
function view(name){state.zoom=1;if(name==='space'){state.yaw=.66;state.pitch=.48}else if(name==='xy'){state.yaw=Math.PI;state.pitch=Math.PI/2}else if(name==='yz'){state.yaw=Math.PI/2;state.pitch=0}else{state.yaw=Math.PI;state.pitch=0}draw()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));$('resetview').onclick=()=>view('space');$('zoomin').onclick=()=>{state.zoom=Math.min(1.3,state.zoom+.1);draw()};$('zoomout').onclick=()=>{state.zoom=Math.max(.6,state.zoom-.1);draw()};
let pointer=null;$('scene').onpointerdown=e=>{pointer={x:e.clientX,y:e.clientY};$('scene').setPointerCapture(e.pointerId)};$('scene').onpointermove=e=>{if(!pointer)return;state.yaw+=(e.clientX-pointer.x)*.008;state.pitch=Math.max(-1.55,Math.min(1.55,state.pitch+(e.clientY-pointer.y)*.008));pointer={x:e.clientX,y:e.clientY};draw()};$('scene').onpointerup=$('scene').onpointercancel=()=>pointer=null;$('scene').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();state.yaw+=(e.key==='ArrowLeft'?-.1:e.key==='ArrowRight'?.1:0);state.pitch=Math.max(-1.55,Math.min(1.55,state.pitch+(e.key==='ArrowUp'?-.1:e.key==='ArrowDown'?.1:0)));draw()};
$('quiz').onclick=()=>{cancelAnimationFrame(animation);state.p=randomPoint();if(state.p.every(v=>v===0))state.p[0]=2;const choices=Array.from($('target').options);state.target=choices[Math.floor(Math.random()*choices.length)].value;$('target').value=state.target;state.quiz=true;state.revealed=state.mode==='point';state.checked=false;state.progress=1;$('feedback').textContent='';for(let i=0;i<3;i++)$('ans'+i).value='';$('question').textContent=state.mode==='point'?'그림에 표시된 점 P의 x, y, z좌표를 차례로 입력하세요.':`P${coord(state.p)}의 ${labels[state.target]}${state.mode==='foot'?'에 내린 수선의 발':'에 대한 대칭점'}의 좌표는?`;update();$('ans0').focus()};
$('check').onclick=()=>{if(!state.quiz){$('feedback').textContent='먼저 새 문제를 눌러 주세요.';return}const a=[0,1,2].map(i=>$('ans'+i).value);if(a.some(v=>v.trim()===''||!Number.isFinite(Number(v)))){$('feedback').textContent='세 좌표를 모두 입력해 주세요.';return}const q=transform(state.p,state.mode,state.target),ok=a.every((v,i)=>Math.abs(Number(v)-q[i])<1e-8);if(!state.checked){state.total++;if(ok)state.correct++;state.checked=true}$('score').textContent=`첫 시도 정답 ${state.correct} / ${state.total}`;state.revealed=true;state.progress=1;$('feedback').textContent=ok?'맞았습니다! 좌표가 어떻게 변했는지 그림에서 확인해 보세요.':`정답은 ${coord(q)}입니다. 바뀐 좌표와 그대로인 좌표를 비교해 보세요.`;$('feedback').style.color=ok?'#146c54':'#a3422d';update()};
setMode('point');
</script></body></html>
