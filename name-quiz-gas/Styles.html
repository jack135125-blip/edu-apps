<style>
:root {
  --ink: #3f322c;
  --muted: #8a7468;
  --line: #f0ddd0;
  --panel: #fffdf9;
  --accent: #ff7b54;
  --accent-deep: #e85d3a;
  --sky: #4ba3c7;
  --mint: #3f9f7a;
  --warn: #d9922f;
  --danger: #d96565;
  --ok: #3f9f7a;
  --shadow: 0 10px 28px rgba(232, 93, 58, 0.12);
  --radius: 18px;
  --font: "Noto Sans KR", sans-serif;
  --display: "Jua", "Noto Sans KR", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(circle at 10% 12%, #ffd6e7 0%, transparent 40%),
    radial-gradient(circle at 90% 6%, #c8ecff 0%, transparent 38%),
    linear-gradient(165deg, #fff6eb, #ffe8f0 48%, #e8f7ff);
  background-attachment: fixed;
  line-height: 1.5;
}

/* Apps Script WebView에서 display 규칙이 hidden을 덮어쓰는 경우 대비 */
[hidden] {
  display: none !important;
}

button, input { font: inherit; }
button {
  border: 0;
  cursor: pointer;
  border-radius: 999px;
  padding: 10px 16px;
  font-weight: 700;
}
input {
  width: 100%;
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  background: #fff;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 72px;
}

.top { margin-bottom: 18px; }
.eyebrow {
  display: inline-block;
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 800;
  color: var(--accent-deep);
  background: #fff;
  border: 2px solid #ffd2c0;
  padding: 3px 10px;
  border-radius: 999px;
}
.top h1 {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(30px, 8vw, 42px);
  font-weight: 400;
  letter-spacing: -0.02em;
  color: #5a3d32;
}
.sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: #fff; color: var(--ink); border: 2px solid var(--line); }
.btn-sky { background: #d9f1fb; color: #1f6f8f; }
.btn-mint { background: #ddf6ec; color: #1f6b4d; }
.btn-ghost { background: transparent; color: var(--muted); padding: 8px 10px; }
.btn-danger { background: #ffe3e3; color: var(--danger); }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn-block { width: 100%; }

.panel {
  background: var(--panel);
  border: 2px solid #ffe0d1;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

.grid { display: grid; gap: 12px; }
.class-card, .mode-card {
  text-align: left;
  width: 100%;
  border-radius: 16px;
  padding: 14px;
  background: #fff;
  border: 2px solid var(--line);
}
.class-card h3, .mode-card h4 {
  margin: 0 0 4px;
  font-size: 17px;
}
.class-card .meta, .mode-card p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 999px;
  background: #fff4ee;
  color: #8a4f3a;
}
.chip.muted { background: #f3f3f3; color: #6b6b6b; }
.chip.warn { background: #fff1d6; color: #9a6500; }
.chip.ok { background: #ddf6ec; color: #1f6b4d; }

.tabs {
  display: flex;
  gap: 6px;
  margin: 14px 0;
  overflow-x: auto;
}
.tab {
  background: #fff;
  border: 2px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
}
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.student-list { display: grid; gap: 10px; }
.student-row {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: #fff;
}
.avatar, .ph {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  object-fit: cover;
  background: #f3ebe4;
}
.ph {
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}
.student-row strong { display: block; }
.student-row small { color: var(--muted); }

.quiz-progress {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
}
.bar {
  height: 8px;
  background: #ffe8dc;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 14px;
}
.bar > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #ffb347);
  width: 0;
}

.quiz-stage { display: grid; gap: 14px; }
.quiz-photo {
  width: min(100%, 320px);
  aspect-ratio: 1;
  margin: 0 auto;
  border-radius: 20px;
  object-fit: cover;
  border: 3px solid #ffd2c0;
  background: #f7efe8;
}
.quiz-prompt {
  text-align: center;
  font-family: var(--display);
  font-size: 28px;
  margin: 0;
}
.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.choice {
  min-height: 52px;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 14px;
  color: var(--ink);
}
.choice.ok { background: #ddf6ec; border-color: #7dceb0; }
.choice.bad { background: #ffe3e3; border-color: #f0a0a0; }
.choice-photo {
  padding: 8px;
  display: grid;
  gap: 6px;
  justify-items: center;
}
.choice-photo img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 12px;
}
.flip-card {
  min-height: 220px;
  border-radius: 20px;
  border: 3px solid #ffd2c0;
  background: #fff;
  display: grid;
  place-items: center;
  padding: 16px;
  text-align: center;
  cursor: pointer;
}
.flip-card img {
  width: min(100%, 240px);
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 16px;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.empty {
  text-align: center;
  padding: 28px 12px;
  color: var(--muted);
}
.empty strong { display: block; color: var(--ink); margin-bottom: 6px; }

.form-grid { display: grid; gap: 10px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 4px;
}
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: #3f322c;
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  z-index: 50;
  max-width: calc(100% - 32px);
}
.toast.err { background: #a63d3d; }

.busy {
  position: fixed;
  inset: 0;
  background: rgba(63, 50, 44, 0.28);
  display: grid;
  place-items: center;
  z-index: 40;
}
.busy-card {
  background: #fff;
  padding: 16px 22px;
  border-radius: 14px;
  font-weight: 800;
  box-shadow: var(--shadow);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(63, 50, 44, 0.35);
  display: grid;
  place-items: end center;
  z-index: 45;
  padding: 12px;
}
.modal-card {
  width: min(100%, 520px);
  background: #fffdf9;
  border-radius: 20px 20px 16px 16px;
  padding: 18px;
  border: 2px solid #ffe0d1;
  margin-bottom: 4px;
}
.modal-card h3 { margin: 0 0 8px; font-size: 18px; }
.modal-card .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}

@media (min-width: 720px) {
  .modal { place-items: center; }
  .modal-card { border-radius: 20px; }
}
</style>
