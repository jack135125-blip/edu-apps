<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>네임브릿지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-screen="home">
  <div class="blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="badge">사진과 이름을 잇는 교사용 클래스 노트</span>
        <h1 id="appTitle">네임브릿지</h1>
        <p class="sub" id="appSub">학생의 얼굴과 이름을 연결하고, 자연스럽게 기억하세요.</p>
      </div>
      <div class="top-side">
        <div class="brand-art" aria-hidden="true">
          <svg viewBox="0 0 180 92" role="img">
            <path class="art-leaf" d="M137 18c21-8 33 3 26 21-5 13-18 18-32 12 1-14 2-24 6-33Z"/>
            <circle class="art-head" cx="69" cy="27" r="15"/>
            <path class="art-body" d="M40 77c2-25 13-37 29-37s28 12 31 37H40Z"/>
            <path class="art-book" d="M89 44c15-8 31-6 42 3v31c-12-8-27-9-42-2V44Z"/>
            <path class="art-page" d="M89 44c-12-8-26-6-36 3v31c10-8 23-9 36-2V44Z"/>
            <path class="art-line" d="M89 47v28M102 52c7-2 13-1 19 2M102 61c7-2 13-1 19 2"/>
            <circle class="art-spark" cx="30" cy="27" r="5"/>
            <path class="art-spark" d="m111 19 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z"/>
          </svg>
        </div>
        <div class="top-actions home-only">
          <button class="btn btn-sky" type="button" id="btnExportData">데이터 내보내기</button>
          <button class="btn btn-ghost" type="button" id="btnImportData">데이터 불러오기</button>
          <button class="btn btn-peach" type="button" id="btnImport">엑셀 파일 불러오기</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="screen active" data-screen="home" id="screenHome"></section>
      <section class="screen" data-screen="class" id="screenClass"></section>
      <section class="screen" data-screen="quiz" id="screenQuiz"></section>
    </main>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div class="drop-card">
      <strong>엑셀 명렬표를 놓으세요</strong>
      <p>xlsx 파일을 여러 개 놓으면 각 파일별로 학급이 만들어집니다.</p>
    </div>
  </div>

  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="busy" id="busy" hidden>
    <div class="spinner"></div>
    <p>불러오는 중…</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
